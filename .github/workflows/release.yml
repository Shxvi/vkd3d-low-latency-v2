name: Build and Release VKD3D Low-Latency v3

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build VKD3D inside official Arch Linux container
        run: |
          docker run --rm -v $(pwd):/workspace -w /workspace archlinux:latest bash -c "
            pacman-key --init && \
            pacman-key --populate archlinux && \
            pacman -Sy --noconfirm archlinux-keyring && \
            pacman -Syu --noconfirm git meson ninja mingw-w64-gcc glslang zstd tar && \
            git config --global --add safe.directory /workspace && \
            ./package-release.sh v3-ll dist --no-package
          "

      - name: Package artifacts
        run: |
          cd dist
          tar -czf vkd3d-low-latency-v3.tar.gz *
          echo "RELEASE_TAG=v3-ll-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "VKD3D Low-Latency v3 (Build ${{ github.run_number }})"
          body: |
            ### VKD3D-Proton Low Latency (x86-64-v3 Optimized)
            - **Target:** x86-64-v3 (AVX2, FMA, BMI1/2)
            - **Flags:** `-O3 -flto`
            - **Commit:** ${{ github.sha }}
          files: |
            dist/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
