name: Build and Release VKD3D Low-Latency v3

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 \
            gcc-mingw-w64-i686 g++-mingw-w64-i686 \
            mingw-w64-tools \
            meson ninja-build glslang-tools zstd

      - name: Build VKD3D
        run: |
          sed -i 's/PATHCCH_NONE/0/g' libs/vkd3d-common/platform.c
          
          ./package-release.sh v3-ll dist --no-package

      - name: Package artifacts
        run: |
          cd dist
          tar -czf vkd3d-low-latency-v3.tar.gz *
          echo "RELEASE_TAG=v3-ll-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "VKD3D Low-Latency v3 (Build ${{ github.run_number }})"
          body: |
            ### VKD3D-Proton Low Latency (x86-64-v3 Optimized)
            - **Target:** x86-64-v3 (AVX2, FMA, BMI1/2)
            - **Flags:** `-O3 -flto`
            - **Commit:** ${{ github.sha }}
          files: |
            dist/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
